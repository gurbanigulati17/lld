name: CI

on:
  push:
    branches: [main, master, 'ccr-**']
    paths: ['taxos/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['taxos/**', '.github/workflows/ci.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine and API (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: taxos/tool/ci.sh engine

  flutter:
    name: Design system, app and web build
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: taxos/tool/ci.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: taxos-web
          path: taxos/apps/taxos_app/build/web
          retention-days: 7

  api-image:
    name: API container builds
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f taxos/services/api/Dockerfile taxos

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: taxos
      - run: flutter build apk --release
        working-directory: taxos/apps/taxos_app
      - uses: actions/upload-artifact@v4
        with:
          name: taxos-apk
          path: taxos/apps/taxos_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
