name: CI

on:
  push:
    branches: [main, master, 'ccr-**']
    paths: ['taxos/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['taxos/**', '.github/workflows/ci.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine and API (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: taxos/tool/ci.sh engine

  flutter:
    name: Design system, app and web build
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: taxos/tool/ci.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: taxos-web
          path: taxos/apps/taxos_app/build/web
          retention-days: 7

  api-image:
    name: API container builds
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f taxos/services/api/Dockerfile taxos

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: taxos
      # One universal APK plus one per ABI (the arm64 one is what most
      # phones need and is a third the size).
      - run: flutter build apk --release && flutter build apk --release --split-per-abi
        working-directory: taxos/apps/taxos_app
      - uses: actions/upload-artifact@v4
        with:
          name: taxos-apk
          path: taxos/apps/taxos_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
      - name: Rename APKs
        run: |
          out=taxos/apps/taxos_app/build/app/outputs/flutter-apk
          n=${{ github.run_number }}
          cp "$out/app-release.apk" "Kardo-$n-universal.apk"
          cp "$out/app-arm64-v8a-release.apk" "Kardo-$n-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "Kardo-$n-armeabi-v7a.apk"
          cp "$out/app-x86_64-release.apk" "Kardo-$n-x86_64.apk"
          ls -la Kardo-*.apk
      # Every CI build on a branch publishes a pre-release so the APK has a
      # stable download link without needing a GitHub login.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Kardo APK build ${{ github.run_number }}
          prerelease: true
          body: |
            Debug-signed release build of the Kardo Flutter app from `${{ github.sha }}` on `${{ github.ref_name }}`.
            Most phones: install the `arm64-v8a` APK. Older 32-bit phones: `armeabi-v7a`. Emulators: `x86_64`. The `universal` APK works everywhere but is three times larger.
            Android 5.0+; allow installs from unknown sources.
          files: Kardo-${{ github.run_number }}-*.apk
