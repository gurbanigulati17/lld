name: Build Calm Pop APK

on:
  push:
    paths:
      - 'calm_pop/**'
      - '.github/workflows/build-calm-pop-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calm_pop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CalmPop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: calm-pop-apk
          path: calm_pop/build/app/outputs/flutter-apk/CalmPop.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calm-pop-v${{ github.run_number }}
          name: Calm Pop (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Download **CalmPop.apk** below and open it on your Android phone.
            Allow "install unknown apps" if Android asks.
          files: calm_pop/build/app/outputs/flutter-apk/CalmPop.apk
