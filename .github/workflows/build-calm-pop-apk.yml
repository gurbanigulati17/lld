name: Build Calm Pop APK

on:
  push:
    paths:
      - 'calm_pop/**'
      - '.github/workflows/build-calm-pop-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calm_pop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: calm-pop-apk
          path: calm_pop/build/app/outputs/flutter-apk/app-release.apk
