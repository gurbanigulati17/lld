name: taxos_ui
description: Kardo design system (Evergreen) — tokens, spacing scale, surfaces and controls.
version: 0.3.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SourceSans3
      fonts:
        - asset: fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: fonts/SourceSans3-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: fonts/SourceSerif4-Semibold.ttf
          weight: 600
        - asset: fonts/SourceSerif4-Bold.ttf
          weight: 700
