name: taxos_app
description: TaxOS — ITR and GST filing for India with a liquid-glass interface.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.4
  http: ^1.2.2
  intl: ^0.20.1
  tax_engine:
    path: ../../packages/tax_engine
  glass_ui:
    path: ../../packages/glass_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
